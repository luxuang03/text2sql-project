<!DOCTYPE html>
<html>
<head>
    <title>SQL Search Results</title>
</head>
<body>
    {% if results and results|length > 0 %}

    <h2>Risultati</h2>

    <table>
    <tbody>
    {% for item in results %}
    <tr>
        {% for prop in item.properties %}
            <td>{{ prop.property_value }}</td>
        {% endfor %}
    </tr>
    {% endfor %}
    </tbody>
    </table>

    {% else %}
    <p>Nessun risultato trovato.</p>
    {% endif %}
