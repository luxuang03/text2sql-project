<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Add</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
        }

        a {
            color: #4f46e5;
            text-decoration: underline;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background-color: #34a853;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2d9449;
        }

        .success {
            color: #217346;
            margin-top: 20px;
        }

        .error {
            color: red;
            margin-top: 20px;
        }

        pre {
            background-color: #f7f7f7;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }

        hr {
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Risultato Add</h1>
        <a href="/">Torna alla Home</a>
        <hr>

        {% if ok %}
        <p class="success">Operazione riuscita (status {{ status }})</p>
        {% else %}
        <p class="error">Errore (status {{ status }})</p>
        {% endif %}

        <pre>{{ body }}</pre>
        <hr>

        <form action="/add" method="post">
            <textarea name="data_line" rows="4" placeholder="Inserisci una riga di dati separata da virgole..."></textarea>
            <br><br>
            <button type="submit">Invia un'altra riga</button>
        </form>
    </div>
</body>
</html>
